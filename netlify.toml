# Netlify configuration for the SAIL frontend (Vite SPA).
#
# This repo is an npm-workspaces monorepo: all dependencies are installed into
# the ROOT node_modules, and the frontend lives in ./frontend. Netlify must
# therefore install from the repo root and build the `frontend` workspace — if
# `base` were set to "frontend", npm would run there with no node_modules and
# the build would fail with "vite: not found".
#
# Netlify UI equivalent:
#   Base directory:    (leave empty / repo root)
#   Build command:     npm ci --include=dev && npm run build -w frontend
#   Publish directory: frontend/dist

[build]
  command = "npm ci --include=dev && npm run build -w frontend"
  publish = "frontend/dist"

[build.environment]
  NODE_VERSION = "20"

# Single-page application fallback so client-side routes (e.g. /library, /admin)
# resolve to index.html instead of 404-ing on a hard refresh.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
